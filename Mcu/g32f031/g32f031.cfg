# ============================================================
#  G32F031 (Geehy, Cortex-M0) — OpenOCD 烧录方案
# ============================================================
#
# 原理
# ------------------------------------------------------------------
#   把 DAPLink 烧录算法(机器码 blob)加载进 SRAM, 每次烧录操作都像
#   "调用函数"一样让 CPU 执行: 设寄存器 + PC -> resume -> 算法完成
#   Flash 解锁/擦除/编程 -> 返回停在 BKPT 停机点 -> host 轮询 halted
#   握手并读 r0 校验。数据校验由 host 回读完成。
#
# 兼容性
# ------------------------------------------------------------------
#   - 仅用标准 DAP/SWD/Cortex-M 操作, 官方版 OpenOCD 0.12 即可运行,
#   - 调试器无关: CMSIS-DAP / J-Link / ST-Link 通用;
#   - 覆盖内置 program 命令: program <hex|bin|elf> [addr] [verify] [reset] [exit] [mass_erase]
#
# 文件结构(★ 移植到其他 MCU 时只改 A 节)
# ------------------------------------------------------------------
#   A 移植配置区(芯片相关: 目标 / Flash / 算法 blob / 入口)
#   B 目标与调试配置(用 A 节常量生成, 一般无需修改)
#   C 底层原语(加载算法 / 调用算法函数)
#   D 算法操作(Init / UnInit / Erase / ProgramPage)
#   E 固件解析(HEX / BIN / ELF -> 段列表)
#   F 烧录与校验
#   G 单命令入口 program
#
# 用法
# ------------------------------------------------------------------
#   openocd -f interface/cmsis-dap.cfg -f target/geehy/algo_g32f031.cfg \
#           -c "program app.elf verify reset exit"
#   openocd ... -c "program app.bin 0x00000000 verify exit"
#   默认只擦固件覆盖到的扇区, 需要整片擦除时追加 mass_erase:
#     openocd ... -c "program app.elf verify reset exit mass_erase"
#
# 本环境(OpenOCD 0.12 / Jim Tcl)要点
# ------------------------------------------------------------------
#   - 无 binary 命令(二进制字段用 scan %c 逐字节读取)
#   - `reg r0` 需正则提取数值
#   - expr 变量替换须用双引号(花括号内不替换)

# ============================================================
# A. 移植配置区 ★★★ 移植到其他 G32F / 其他 MCU 时只改这一节
# ============================================================
# 移植步骤:
#   1. 按需改 A1 的目标名 / IDCODE / 传输方式
#   2. 按新芯片手册改 A2 的 Flash 几何与控制器寄存器
#   3. 按新芯片 FLM 的 program_target_t 改 A3 的算法 RAM 布局
#   4. 整体替换 A4 的算法 blob(ALGO_BIN), 再按 program_target_t
#      的函数表更新 A5 的入口地址

# --- A1. 目标基本配置 ---
if { ![info exists CHIPNAME] } { set CHIPNAME G32F031 }   ;# 目标名(board 脚本可预先覆盖)
if { ![info exists CPUTAPID] } { set CPUTAPID 0x0bc11477 } ;# SW-DP IDCODE(-c 可覆盖)
set TARGET_TRANSPORT swd                                   ;# 传输方式: swd 或 jtag

# --- A2. Flash 几何与控制器寄存器 ---
set FLASH_BASE 0x00000000      ;# 片内 Flash 起始地址
set FLASH_SIZE 0x00010000      ;# 总容量 64KB(仅作参考)
set FLASH_SECTOR_SIZE 0x200    ;# 扇区大小 512B(按扇区擦除用)
set FLASH_AUTO_MASS_ERASE_THRESHOLD 64  ;# 覆盖扇区数达此值自动整片擦(整片擦 1 次握手, 快于逐扇区); 设超大值禁用
set FMC_BASE   0x40020800      ;# Flash 控制器基址
set FMC_WKEY   [expr {$FMC_BASE + 0x00}]  ;# 写使能键(reset-deassert-post 解锁用)
set FMC_MKEY   [expr {$FMC_BASE + 0x04}]  ;# 主写使能键(reset-init / reset-deassert-post 解锁用)
set FMC_CR     [expr {$FMC_BASE + 0x14}]  ;# 控制寄存器(排查用)
set FMC_SR     [expr {$FMC_BASE + 0x1C}]  ;# 状态寄存器(排查用)

# --- A3. 算法 RAM 布局(必须与 FLM 的 program_target_t 一致) ---
set algo_blob_base     0x20000000  ;# blob 加载/链接地址
set algo_halt_trap     [expr {$algo_blob_base + 1}]  ;# 停机陷阱(blob 首字 0xBE00)
set algo_stack_ptr     0x20000a00  ;# 算法栈顶(program_target_t.RSP)
set algo_data_buf_addr 0x20000a00  ;# ProgramPage 数据缓冲地址(mem buffer)
set algo_page_size     0x200       ;# 单页字节数(ram_to_flash_bytes_to_be_written)

# --- A4. 算法 blob(机器码, 共 111 字 = 444 字节) ---
# 来源: G32F031_DAL_SDK_V1.0.2\Utilities\FLM\target_blob.c 的
#       G32F031_64_MFlash_flash_prog_blob[] 数组(由 Keil FLM 生成)
# 结构: 前 100 字为 Thumb 代码, 后 11 字为字面量池(常量: Flash 地址与解锁键)
# 关键约定:
#   - 首字 0xe7fdbe00 = `BKPT #0` + `B .-2`(停机陷阱); 算法函数以
#     POP{pc} 返回, lr 固定指向 algo_halt_trap, 返回即停在停机点
#   - 函数按 AAPCS 用 r0-r2 传参, blob 自含 Flash 解锁逻辑
set ALGO_BIN {
	0xe7fdbe00 0x4963b510 0x07c069c8 0x4863d1fc
	0x60034b61 0x24016842 0x60424322 0x07926842
	0x2400d5fc 0x68826084 0xd4fc0792 0x610460c4
	0x62846244 0x630462c4 0x04122201 0x48596002
	0x60024a57 0x60134a58 0x63824a58 0x60084858
	0x02402001 0x69c86148 0x43902260 0x200061c8
	0x484cbd10 0x60416841 0x60012100 0x47704608
	0x69c14848 0xd1fc07c9 0x6041494e 0x08896941
	0x61410089 0x22026941 0x61414311 0x22004944
	0x69c16011 0xd1fc07c9 0x06c969c1 0x69c1d5fc
	0x43912210 0x200061c8 0x493a4770 0x07d269ca
	0x4a40d1fc 0x694a604a 0x00920892 0x694a614a
	0x431a2301 0x4a36614a 0x69c86002 0xd1fc07c0
	0x06c069c8 0x69c8d5fc 0x43902210 0x200061c8
	0xb5fc4770 0x93002300 0x074b9301 0x24000f5b
	0x466d4e28 0x1acfe005 0x5dd7193f 0x1e5b552f
	0x2b001c64 0x69f4d1f7 0xd1fc07e4 0x60744c29
	0x08a46974 0x617400a4 0x25036974 0x6174432c
	0x00c908c9 0x24102760 0xca20e013 0x1f09c020
	0x07ed69f5 0x69f5d1fc 0x0fad066d 0x69f5d118
	0xd5fc06ed 0x1c6d2500 0xdbfc2d64 0x43a569f5
	0x290061f5 0x2b00d1e9 0x9900d019 0x99016001
	0x69f06041 0xd1fc07c0 0x064069f0 0xd0040f80
	0x43b869f0 0x200161f0 0x69f0bdfc 0xd5fc06c0
	0x1c402000 0xdbfc2864 0x43a069f0 0x200061f0
	0x0000bdfc 0x40020800 0x000087e4 0x40020400
	0x0000a5a5 0x40000500 0x40000400 0xa5a50001
	0x3399aa55 0xabcd6789 0x00000000
}

# --- A5. 算法函数入口(program_target_t 的绝对地址, 带 Thumb 位) ---
# 注意: 入口值带 Thumb 位, algo_call 写 PC 前会自动去掉最低位
set algo_entry_init        0x20000005  ;# Init(adr, clk, fnc)
set algo_entry_uninit      0x20000063  ;# UnInit(adr)
set algo_entry_erasechip   0x20000071  ;# EraseChip()
set algo_entry_erasesector 0x200000ab  ;# EraseSector(adr)
set algo_entry_programpage 0x200000e3  ;# ProgramPage(adr, sz, buf)
# blob 无 Verify 函数, 校验由 host 端 algo_verify 回读完成

# ============================================================
# B. 目标与调试配置(由 A 节常量生成, 一般无需修改)
# ============================================================
# 传输: 非 HLA 调试器(CMSIS-DAP/J-Link 等)显式选 SWD;
# ST-Link HLA 只支持 hla_swd, 由接口脚本自己选, 此处不覆盖
if {![using_hla]} {
	transport select $TARGET_TRANSPORT
}
source [find target/swj-dp.tcl]

swj_newdap $CHIPNAME cpu -expected-id $CPUTAPID
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -endian little -dap $CHIPNAME.dap

# Work area 起始 = 算法数据缓冲末尾, 自动避开 blob 与缓冲
set work_area_start [expr {$algo_data_buf_addr + $algo_page_size}]
$CHIPNAME.cpu configure -work-area-phys $work_area_start -work-area-size 0x1000 -work-area-backup 0

adapter speed 1000
if {![using_hla]} {
	cortex_m reset_config sysresetreq
}

# reset-init: 复位后兜底解锁 Flash(MKEY)。blob 内部也会解锁, 此为保险
$CHIPNAME.cpu configure -event reset-init {
	mww $FMC_MKEY 0xABCD6789
}

# reset-deassert-post: 每次复位解除后都解锁 Flash, 否则 CPU 取向量表
# 失败会 LOCKUP(MKEY + WKEY 都要写, 参照 g32f031.cfg 实测)
$CHIPNAME.cpu configure -event reset-deassert-post {
	mww $FMC_MKEY 0xABCD6789
	mww $FMC_WKEY 0x3399AA55
}

# ============================================================
# C. 底层原语: 加载算法 / 调用算法函数
# ============================================================

# 把 ALGO_BIN 逐字写入 RAM, 回读首字确认加载成功
proc algo_load {} {
	global ALGO_BIN algo_blob_base
	halt
	set byte_offset 0
	foreach word $ALGO_BIN {
		mww [expr {$algo_blob_base + $byte_offset}] $word
		incr byte_offset 4
	}
	# 回读首字校验(mem2array 已弃用, 用 read_memory)
	set readback_word [read_memory $algo_blob_base 32 1]
	if {[lindex $readback_word 0] != [lindex $ALGO_BIN 0]} {
		error "algo blob 加载校验失败"
	}
	puts "algo loaded: [llength $ALGO_BIN] words @ 0x[format %08x $algo_blob_base]"
}

# 调用算法函数: 设寄存器 -> resume -> 等 CPU 停在停机点 -> 检查返回值
# 步骤:
#   1. 若 CPU 已停在停机点则直接复用, 否则先 halt(省一次多余握手)
#   2. sp 指向算法栈, lr 指向停机陷阱(函数 POP{pc} 返回即停在 BKPT)
#   3. arg0-arg2 依次写入 r0-r2(AAPCS 传参), pc 写入口地址(去 Thumb 位)
#   4. resume 后 arp_waitstate 紧轮询等待停机, 超时(timeout_ms)报错
#   5. 读 r0 返回值, 非 0 视为算法执行失败
proc algo_call {entry_addr {arg0 0} {arg1 0} {arg2 0} {timeout_ms 5000}} {
	global algo_stack_ptr algo_halt_trap CHIPNAME
	if {[$CHIPNAME.cpu curstate] != "halted"} { halt }
	reg sp $algo_stack_ptr
	reg lr $algo_halt_trap
	reg r0 $arg0
	reg r1 $arg1
	reg r2 $arg2
	reg pc [expr {$entry_addr & 0xFFFFFFFE}]
	resume
	# 握手: arp_waitstate 立即轮询等停机, 不受后台 ~100ms 轮询粒度限制,
	# 单次调用可省几十 ms(curstate 仅读缓存, 依赖后台轮询更新)
	if {[catch {$CHIPNAME.cpu arp_waitstate halted $timeout_ms} wait_err]} {
		error "algo_call: timeout at 0x[format %08x $entry_addr]"
	}
	# 读 r0 返回值(0 = 成功)
	# 坑: 本构建的 `reg r0` 返回 "r0 (/32): 0x00000000" 字符串, 需提取数值
	set reg_r0_string [reg r0]
	if {![regexp {0x([0-9a-fA-F]+)} $reg_r0_string -> r0_hex]} {
		error "algo_call: 无法解析 r0 返回值: $reg_r0_string"
	}
	# 坑: expr 要替换变量必须用双引号, 花括号内不做替换
	set return_value [expr "0x$r0_hex"]
	if {$return_value != 0} {
		error "algo_call: entry 0x[format %08x $entry_addr] returned error 0x[format %08x $return_value]"
	}
}

# ============================================================
# D. 算法操作(AAPCS: r0-r2 传参)
# ============================================================

# Init(adr=0, clk=0, fnc=1): 解锁 Flash 并等待就绪
proc algo_init {} {
	global algo_entry_init
	reset halt
	algo_load
	algo_call $algo_entry_init 0 0 1
}

# UnInit(adr=0): 退出 Flash 编程模式
proc algo_uninit {} {
	global algo_entry_uninit
	algo_call $algo_entry_uninit 0
}

# 整片擦除
proc algo_erasechip {} {
	global algo_entry_erasechip
	algo_call $algo_entry_erasechip
}

# 擦除单个扇区(sector_addr: 扇区起始地址)
proc algo_erasesector {sector_addr} {
	global algo_entry_erasesector
	algo_call $algo_entry_erasesector $sector_addr
}

# 收集固件覆盖到的扇区起始地址(按 FLASH_SECTOR_SIZE 对齐, 去重排序)
proc _collect_firmware_sectors {segments} {
	global FLASH_SECTOR_SIZE
	set sectors {}
	foreach segment $segments {
		set seg_base_addr [lindex $segment 0]
		set seg_word_count [llength [lindex $segment 1]]
		set seg_end_addr [expr {$seg_base_addr + $seg_word_count * 4}]
		set sector_addr $seg_base_addr
		while {$sector_addr < $seg_end_addr} {
			set aligned_addr [expr {$sector_addr & ~($FLASH_SECTOR_SIZE - 1)}]
			if {[lsearch -exact $sectors $aligned_addr] < 0} {
				lappend sectors $aligned_addr
			}
			set sector_addr [expr {$aligned_addr + $FLASH_SECTOR_SIZE}]
		}
	}
	return [lsort -integer $sectors]
}

# 逐扇区擦除(sectors: 已收集的扇区起始地址列表)
proc algo_erase_sectors {sectors} {
	foreach sector_addr $sectors {
		algo_erasesector $sector_addr
	}
	puts "erased [llength $sectors] sector(s)"
}

# 擦除固件覆盖到的扇区(收集扇区后逐扇区调用 blob 的 EraseSector)
proc algo_erase_firmware_sectors {file_path load_addr} {
	algo_erase_sectors [_collect_firmware_sectors [parse_firmware $file_path $load_addr]]
}

# 编程一页(flash_addr: Flash 地址, size_bytes: 字节数, buf_addr: SRAM 缓冲地址)
proc algo_programpage {flash_addr size_bytes buf_addr} {
	global algo_entry_programpage
	algo_call $algo_entry_programpage $flash_addr $size_bytes $buf_addr
}

# ============================================================
# E. 固件解析(HEX / BIN / ELF32 -> 段列表)
# ============================================================
# 段列表格式: { {起始地址 字列表} ... }
#   - 段内地址连续, 每字为 4 字节小端
#   - 段间地址可跳变(如 .text 与 .data 分离)
# 说明: 本 OpenOCD 的 Jim Tcl 无 binary 命令, 二进制字段
#       用 scan %c 逐字节读取后再移位拼装。

# 从 data 的 offset 起读一个 32 位小端无符号整数
proc _le32 {data offset} {
	set byte0 [scan [string index $data $offset] %c]
	set byte1 [scan [string index $data [expr {$offset + 1}]] %c]
	set byte2 [scan [string index $data [expr {$offset + 2}]] %c]
	set byte3 [scan [string index $data [expr {$offset + 3}]] %c]
	return [expr {$byte0 | ($byte1 << 8) | ($byte2 << 16) | ($byte3 << 24)}]
}

# 从 data 的 offset 起读一个 16 位小端无符号整数
proc _le16 {data offset} {
	set byte0 [scan [string index $data $offset] %c]
	set byte1 [scan [string index $data [expr {$offset + 1}]] %c]
	return [expr {$byte0 | ($byte1 << 8)}]
}

# 从 data 的 offset 起取 byte_count 字节, 按 4 字节小端打包成字列表
# (尾部不足 4 字节的部分丢弃)
proc _pack_le_words {data offset byte_count} {
	set word_list {}
	set i 0
	while {$i + 4 <= $byte_count} {
		set byte0 [scan [string index $data [expr {$offset + $i}]] %c]
		set byte1 [scan [string index $data [expr {$offset + $i + 1}]] %c]
		set byte2 [scan [string index $data [expr {$offset + $i + 2}]] %c]
		set byte3 [scan [string index $data [expr {$offset + $i + 3}]] %c]
		lappend word_list [expr {$byte0 | ($byte1 << 8) | ($byte2 << 16) | ($byte3 << 24)}]
		incr i 4
	}
	return $word_list
}

# Intel HEX -> 段列表
# 记录类型: 00 数据 / 01 结束 / 02 扩展段地址 / 04 扩展线性地址
proc parse_hex {hex_path} {
	set file_handle [open $hex_path r]
	# 输出: 段列表
	set segments {}
	# 当前段起始地址 / 已收集的字
	set segment_addr 0
	set segment_words {}
	# 地址基址(由 02/04 型记录更新)
	set addr_base 0
	# 数据区起始列: ":"(1) + 长度(2) + 地址(4) + 类型(2) = 9
	set data_start_col 9
	while {[gets $file_handle line] >= 0} {
		if {[string index $line 0] != ":"} { continue }
		set record_byte_count [expr 0x[string range $line 1 2]]
		set record_offset    [expr 0x[string range $line 3 6]]
		set record_type      [expr 0x[string range $line 7 8]]
		if {$record_type == 0} {
			# 数据记录: 绝对地址 = 基址 + 记录内偏移
			set abs_addr [expr {$addr_base + $record_offset}]
			# 地址不连续则收拢当前段, 另起新段
			if {[llength $segment_words] > 0 && $abs_addr != $segment_addr} {
				lappend segments [list $segment_addr $segment_words]
				set segment_words {}
			}
			set segment_addr $abs_addr
			# 每 4 字节按小端组装成一个 32 位字
			for {set i 0} {$i < $record_byte_count} {incr i 4} {
				set byte0 [expr 0x[string range $line [expr {$data_start_col + $i*2}]   [expr {$data_start_col + $i*2 + 1}]]]
				set byte1 [expr 0x[string range $line [expr {$data_start_col + $i*2 + 2}] [expr {$data_start_col + $i*2 + 3}]]]
				set byte2 [expr 0x[string range $line [expr {$data_start_col + $i*2 + 4}] [expr {$data_start_col + $i*2 + 5}]]]
				set byte3 [expr 0x[string range $line [expr {$data_start_col + $i*2 + 6}] [expr {$data_start_col + $i*2 + 7}]]]
				lappend segment_words [expr {$byte0 | ($byte1 << 8) | ($byte2 << 16) | ($byte3 << 24)}]
			}
		} elseif {$record_type == 1} {
			# EOF 记录: 数据已收齐, 结束循环
			break
		} elseif {$record_type == 4} {
			# 扩展线性地址: 基址高 16 位(用于超过 64KB 的地址空间)
			set addr_base [expr {[expr 0x[string range $line 9 12]] << 16}]
		} elseif {$record_type == 2} {
			# 扩展段地址: 基址 = 段号 << 4(老格式)
			set addr_base [expr {[expr 0x[string range $line 9 12]] << 4}]
		}
	}
	close $file_handle
	# 收拢最后一段
	if {[llength $segment_words] > 0} { lappend segments [list $segment_addr $segment_words] }
	return $segments
}

# 裸 BIN -> 段列表(单段, 地址由调用者给定)
proc parse_bin {bin_path load_addr} {
	set file_handle [open $bin_path rb]
	set file_data [read $file_handle]
	close $file_handle
	set word_list [_pack_le_words $file_data 0 [string length $file_data]]
	return [list [list $load_addr $word_list]]
}

# ELF32(小端) -> 段列表
# 只解析 PT_LOAD 程序段, 以 p_paddr 为加载地址, 取 p_filesz 字节
# (memsz > filesz 的 BSS 部分不烧录)
proc parse_elf {elf_path} {
	set file_handle [open $elf_path rb]
	set file_data [read $file_handle]
	close $file_handle
	# 魔数校验: 0x7F 'E' 'L' 'F'
	if {[string range $file_data 0 3] ne "\x7fELF"} {
		error "not an ELF file: $elf_path"
	}
	# e_ident[4]=EI_CLASS(1=ELF32), e_ident[5]=EI_DATA(1=小端)
	if {[scan [string index $file_data 4] %c] != 1} {
		error "仅支持 ELF32 (32-bit)"
	}
	if {[scan [string index $file_data 5] %c] != 1} {
		error "仅支持小端(Little-endian) ELF"
	}
	# 程序头表信息: e_phoff(偏移28) / e_phentsize(42) / e_phnum(44)
	set program_header_offset     [_le32 $file_data 28]
	set program_header_entry_size [_le16 $file_data 42]
	set program_header_count      [_le16 $file_data 44]
	set segments {}
	for {set i 0} {$i < $program_header_count} {incr i} {
		set entry_offset [expr {$program_header_offset + $i * $program_header_entry_size}]
		# 只处理 PT_LOAD(类型 1)
		if {[_le32 $file_data $entry_offset] != 1} { continue }
		set segment_file_offset [_le32 $file_data [expr {$entry_offset + 4}]]
		set segment_load_addr  [_le32 $file_data [expr {$entry_offset + 12}]]
		set segment_file_size  [_le32 $file_data [expr {$entry_offset + 16}]]
		if {$segment_file_size == 0} { continue }
		set word_list [_pack_le_words $file_data $segment_file_offset $segment_file_size]
		lappend segments [list $segment_load_addr $word_list]
	}
	if {[llength $segments] == 0} {
		error "ELF 中没有可加载的 PT_LOAD 段: $elf_path"
	}
	return $segments
}

# 按文件扩展名分发到对应解析器(其余后缀按 HEX 处理)
proc parse_firmware {file_path {load_addr 0}} {
	set file_ext [string tolower [file extension $file_path]]
	if {$file_ext eq ".bin"} { return [parse_bin $file_path $load_addr] }
	if {$file_ext eq ".elf"} { return [parse_elf $file_path] }
	return [parse_hex $file_path]
}

# ============================================================
# F. 烧录与校验
# ============================================================

# 把一段数据写入 SRAM 缓冲(不足一页补 0xFF), 再调用 ProgramPage 烧一页
# 要点: blob 的 ProgramPage 对非整页 size 会丢最后 4 字节, 故一律按
#       整页 algo_page_size 提交, 补齐用 0xFF(擦除值, 无害)
proc algo_write_page {word_list start_index word_count flash_addr} {
	global algo_data_buf_addr algo_page_size
	set page_word_capacity [expr {$algo_page_size / 4}]
	# 待写数据一次批量写入缓冲(write_memory 的 data 为列表, 省掉逐字 mww)
	set chunk_words [lrange $word_list $start_index [expr {$start_index + $word_count - 1}]]
	write_memory $algo_data_buf_addr 32 $chunk_words
	# 0xFF 补齐到整页(mww count 填充连续地址, 省掉逐字循环)
	set pad_count [expr {$page_word_capacity - $word_count}]
	if {$pad_count > 0} {
		mww [expr {$algo_data_buf_addr + $word_count * 4}] 0xFFFFFFFF $pad_count
	}
	algo_programpage $flash_addr $algo_page_size $algo_data_buf_addr
}

# 分页烧写: 逐段逐页调用 algo_write_page
proc algo_program {file_path {load_addr 0}} {
	global algo_page_size
	set segments [parse_firmware $file_path $load_addr]
	set page_word_capacity [expr {$algo_page_size / 4}]
	set total_word_count 0
	foreach segment $segments {
		set seg_base_addr [lindex $segment 0]
		set seg_words     [lindex $segment 1]
		set segment_word_count [llength $seg_words]
		set written_count 0
		while {$written_count < $segment_word_count} {
			set page_chunk_size [expr {$segment_word_count - $written_count}]
			if {$page_chunk_size > $page_word_capacity} { set page_chunk_size $page_word_capacity }
			algo_write_page $seg_words $written_count $page_chunk_size \
				[expr {$seg_base_addr + $written_count*4}]
			set written_count [expr {$written_count + $page_chunk_size}]
		}
		set total_word_count [expr {$total_word_count + $segment_word_count}]
	}
	puts "programmed $total_word_count words ([expr {$total_word_count*4}] bytes)"
}

# 回读校验(host 端完成, 不依赖算法的 Verify 函数)
# 不匹配时输出地址与期望/实际值(最多 16 条)
proc algo_verify {file_path {load_addr 0}} {
	set segments [parse_firmware $file_path $load_addr]
	set read_chunk_words 512
	set mismatch_count 0
	set total_word_count 0
	set mismatch_msgs {}
	foreach segment $segments {
		set seg_base_addr [lindex $segment 0]
		set seg_words     [lindex $segment 1]
		set segment_word_count [llength $seg_words]
		set checked_count 0
		while {$checked_count < $segment_word_count} {
			set read_count [expr {$segment_word_count - $checked_count}]
			if {$read_count > $read_chunk_words} { set read_count $read_chunk_words }
			set flash_words [read_memory [expr {$seg_base_addr + $checked_count*4}] 32 $read_count]
			for {set i 0} {$i < $read_count} {incr i} {
				set expected_word [lindex $seg_words [expr {$checked_count + $i}]]
				set actual_word   [lindex $flash_words $i]
				if {$actual_word != $expected_word} {
					incr mismatch_count
					if {[llength $mismatch_msgs] < 16} {
						lappend mismatch_msgs [format "0x%08x exp=0x%08x act=0x%08x" \
							[expr {$seg_base_addr + ($checked_count + $i) * 4}] $expected_word $actual_word]
					}
				}
			}
			set checked_count [expr {$checked_count + $read_count}]
		}
		set total_word_count [expr {$total_word_count + $segment_word_count}]
	}
	if {$mismatch_count} {
		error "$mismatch_count verify mismatches -> [join $mismatch_msgs { | }]"
	} else {
		puts "Verify OK ($total_word_count words)"
	}
}

# ============================================================
# G. 单命令入口 program
# ============================================================

# 从 Flash 向量表取 sp/pc 并设置(不自动 resume, 供手动调试)
proc algo_run {} {
	global FLASH_BASE
	halt
	set vector_sp [read_memory $FLASH_BASE 32 1]
	set vector_pc [read_memory [expr {$FLASH_BASE + 4}] 32 1]
	reg sp $vector_sp
	reg pc $vector_pc
	echo "set sp=0x[format %08x $vector_sp], pc=0x[format %08x $vector_pc]"
}

# 覆盖内置 program: 一条命令完成
#   复位+加载算法 -> 擦除(默认按扇区, 传 mass_erase 整片) -> 分页烧录 -> 卸载算法
#   -> (校验) -> (复位运行) -> (退出)
# 用法: program <hex|bin|elf> [addr] [verify] [reset] [exit] [mass_erase]
if { [info procs _orig_program] eq "" } { rename program _orig_program }
proc program {args} {
	global FLASH_AUTO_MASS_ERASE_THRESHOLD
	if {[llength $args] < 1} {
		error "usage: program <hex|bin|elf> [addr] [verify] [reset] [exit] [mass_erase]"
	}
	set file_path [lindex $args 0]
	set load_addr 0
	set do_verify 0
	set do_reset 0
	set do_exit 0
	set do_mass_erase 0
	# 参数解析: verify/reset/exit/mass_erase 为开关, 其余按地址处理
	foreach arg [lrange $args 1 end] {
		if {$arg eq "verify"} {
			set do_verify 1
		} elseif {$arg eq "reset"} {
			set do_reset 1
		} elseif {$arg eq "exit"} {
			set do_exit 1
		} elseif {$arg eq "mass_erase"} {
			set do_mass_erase 1
		} else {
			set load_addr $arg
		}
	}
	init
	debug_level 0
	# 压掉每次算法调用产生的 user 级 halt 状态行(如 "target halted due to
	# breakpoint..."), 日志重定向到空设备(Windows 的 NUL; Linux 改 /dev/null);
	# 进度用 puts 输出, 不受影响
	log_output NUL
	if {[catch {
		puts "Init..."
		algo_init
		puts "Erase..."
		if {$do_mass_erase} {
			set elapsed [time {algo_erasechip}]
		} else {
			# 启发式: 覆盖扇区达到阈值时自动整片擦(1 次握手), 否则逐扇区擦
			set sectors [_collect_firmware_sectors [parse_firmware $file_path $load_addr]]
			if {[llength $sectors] >= $FLASH_AUTO_MASS_ERASE_THRESHOLD} {
				set elapsed [time {algo_erasechip}]
			} else {
				set elapsed [time {algo_erase_sectors $sectors}]
			}
		}
		puts "  erase: [format %.1f [expr {[lindex $elapsed 0] / 1000.0}]] ms"
		puts "Program..."
		set elapsed [time {algo_program $file_path $load_addr}]
		puts "  program: [format %.1f [expr {[lindex $elapsed 0] / 1000.0}]] ms"
		puts "UnInit..."
		algo_uninit
		if {$do_verify} { algo_verify $file_path $load_addr }
		if {$do_reset} { reset run }
	} err]} {
		# 出错: 先恢复日志再原样上抛, 保证错误信息在控制台可见
		log_output default
		error $err
	}
	log_output default
	puts "Done."
	if {$do_exit} { shutdown }
}

# 兼容入口: algo_download <file> [addr] (等价于 program)
proc algo_download {file_path {load_addr 0}} {
	program $file_path $load_addr
}

