name: SITL Tests

# The SITL simulator is built here; the models, datasets, GUI and test
# suites live in the ESCSim repository, which is cloned to test this
# firmware. AM32_ROOT points ESCSim's tools at this checkout instead of
# its own pinned am32-firmware submodule, so every job tests the branch
# under CI.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      escsim_ref:
        description: 'ESCSim ref to test against'
        required: false
        default: 'main'
        type: string

env:
  ESCSIM_REF: ${{ inputs.escsim_ref || 'main' }}

jobs:
  sitl-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out ESCSim
        uses: actions/checkout@v4
        with:
          repository: am32-firmware/ESCSim
          ref: ${{ env.ESCSIM_REF }}
          path: ESCSim

      - name: Build SITL
        run: make AM32_SITL_CAN

      - name: Install pydronecan
        run: python3 -m pip install dronecan pyserial

      - name: Run SITL tests
        env:
          AM32_ROOT: ${{ github.workspace }}
        run: |
          mkdir sitl_test_run && cd sitl_test_run
          python3 "$GITHUB_WORKSPACE/ESCSim/SITL/run_ci_tests.py"

      - name: Upload SITL log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sitl-test-log
          path: sitl_test_run/sitl_ci.log

  asan-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out ESCSim
        uses: actions/checkout@v4
        with:
          repository: am32-firmware/ESCSim
          ref: ${{ env.ESCSIM_REF }}
          path: ESCSim

      - name: Build SITL with AddressSanitizer
        run: make AM32_SITL_CAN SITL_SANITIZE=address

      - name: Install pydronecan
        run: python3 -m pip install dronecan pyserial

      - name: Run SITL tests under ASan
        env:
          AM32_ROOT: ${{ github.workspace }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=0:abort_on_error=0
        run: |
          mkdir sitl_test_run && cd sitl_test_run
          python3 "$GITHUB_WORKSPACE/ESCSim/SITL/run_ci_tests.py"

      - name: Upload SITL log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asan-test-log
          path: sitl_test_run/sitl_ci.log

  ubsan-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out ESCSim
        uses: actions/checkout@v4
        with:
          repository: am32-firmware/ESCSim
          ref: ${{ env.ESCSIM_REF }}
          path: ESCSim

      - name: Build SITL with UndefinedBehaviorSanitizer
        run: make AM32_SITL_CAN SITL_SANITIZE=undefined

      - name: Install pydronecan
        run: python3 -m pip install dronecan pyserial

      - name: Run SITL tests under UBSan
        env:
          AM32_ROOT: ${{ github.workspace }}
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir sitl_test_run && cd sitl_test_run
          python3 "$GITHUB_WORKSPACE/ESCSim/SITL/run_ci_tests.py"

      - name: Upload SITL log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubsan-test-log
          path: sitl_test_run/sitl_ci.log

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out ESCSim
        uses: actions/checkout@v4
        with:
          repository: am32-firmware/ESCSim
          ref: ${{ env.ESCSIM_REF }}
          path: ESCSim

      - name: Install python and gcovr
        run: python3 -m pip install dronecan pyserial gcovr

      - name: Build and run with coverage
        env:
          AM32_ROOT: ${{ github.workspace }}
        run: |
          mkdir sitl_test_run && cd sitl_test_run
          bash "$GITHUB_WORKSPACE/ESCSim/SITL/run_coverage.sh"

      - name: Coverage summary
        run: cat sitl_test_run/coverage/coverage.txt || true

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: sitl_test_run/coverage/

  gui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out ESCSim
        uses: actions/checkout@v4
        with:
          repository: am32-firmware/ESCSim
          ref: ${{ env.ESCSIM_REF }}
          path: ESCSim

      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libfontconfig1 libxkbcommon0

      - name: Build SITL
        run: make AM32_SITL_CAN

      - name: Create GUI environment
        run: python3 ESCSim/SITL/make_gui_env.py

      - name: Run GUI test (offscreen)
        env:
          AM32_ROOT: ${{ github.workspace }}
        run: |
          mkdir gui_test_run && cd gui_test_run
          python3 "$GITHUB_WORKSPACE/ESCSim/SITL/gui_ci_test.py" \
            --gui-python "$GITHUB_WORKSPACE/ESCSim/SITL/venv/bin/python3"

      - name: Upload SITL log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-log
          path: gui_test_run/sitl_ci.log

  macos-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out ESCSim
        uses: actions/checkout@v4
        with:
          repository: am32-firmware/ESCSim
          ref: ${{ env.ESCSIM_REF }}
          path: ESCSim

      - name: Build SITL
        run: make AM32_SITL_CAN

      - name: Install pydronecan
        run: python3 -m pip install --break-system-packages dronecan pyserial

      # GitHub macOS runners do not loop the DroneCAN multicast group back
      # on the default interface (the SITL logs "multicast loopback
      # failed" and the DroneCAN tests get no traffic), so route it to
      # loopback - the macOS equivalent of the Linux "ip route add
      # 239.65.82.0/24 dev lo" the SITL's self test expects.
      - name: Route the DroneCAN multicast group to loopback
        run: sudo route -n add -net 239.65.82.0/24 -interface lo0 || true

      - name: Run SITL tests
        env:
          AM32_ROOT: ${{ github.workspace }}
        run: |
          mkdir sitl_test_run && cd sitl_test_run
          python3 "$GITHUB_WORKSPACE/ESCSim/SITL/run_ci_tests.py"

      - name: Create GUI environment
        run: python3 ESCSim/SITL/make_gui_env.py

      - name: Run GUI test (offscreen)
        env:
          AM32_ROOT: ${{ github.workspace }}
        run: |
          mkdir gui_test_run && cd gui_test_run
          python3 "$GITHUB_WORKSPACE/ESCSim/SITL/gui_ci_test.py" \
            --gui-python "$GITHUB_WORKSPACE/ESCSim/SITL/venv/bin/python3"

      - name: Upload SITL log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sitl-test-log-macos
          path: |
            sitl_test_run/sitl_ci.log
            gui_test_run/sitl_ci.log

  # the cross-built exe is what the ESCSim GUI packaging bundles for
  # Windows users, so a break here must fail the firmware build too
  windows-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cross-build native Windows SITL
        run: |
          make AM32_SITL_CAN SITL_CROSS=win
          mkdir -p sitl-windows
          cp obj/AM32_AM32_SITL_CAN_*.elf sitl-windows/AM32_SITL_CAN.exe

      - uses: actions/upload-artifact@v4
        with:
          name: sitl-windows-exe
          path: sitl-windows/AM32_SITL_CAN.exe

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-core make

      - name: Build SITL
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: |
          cd $(cygpath -u "$GITHUB_WORKSPACE")
          make AM32_SITL_CAN
          ls -la obj/

      - name: Boot smoke test
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: |
          cd $(cygpath -u "$GITHUB_WORKSPACE")
          # explicit ports: Windows reserves chunks of the ephemeral
          # range and the defaults can land in an excluded block
          # (state bind fails with Permission denied)
          ./obj/AM32_AM32_SITL_CAN_*.elf --can-uri none --input-type 1 \
            --input-port 18470 --state-port 18471 >boot.log 2>&1 &
          sleep 3
          kill %1 || true
          cat boot.log
          grep -q "PWM/DShot input on udp port" boot.log
          grep -q "state/model port udp" boot.log

      - name: Package binary with cygwin runtime
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: |
          cd $(cygpath -u "$GITHUB_WORKSPACE")
          mkdir -p sitl-windows
          cp obj/AM32_AM32_SITL_CAN_*.elf sitl-windows/AM32_SITL_CAN.exe
          cp /bin/cygwin1.dll sitl-windows/

      - name: Upload Windows SITL binary
        uses: actions/upload-artifact@v4
        with:
          name: sitl-windows
          path: sitl-windows/
