# .github/workflows/nes_80a_build.yml
# NES 80A 전용 빌드. 모든 브랜치 push / PR / 수동 실행에서 두 타깃을 빌드하고,
# 태그 push 시 릴리스 자산으로 hex를 첨부합니다.
#
# 업스트림 CICD_build.yml은 13개 MCU의 모든 타깃을 빌드하므로 포크에서는
# 이 파일만 남기고 CICD_build.yml을 비활성화하는 것을 권장합니다.
name: NES 80A build

on:
  push:            # 브랜치 필터 없음 → 기능 브랜치 push도 빌드
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 업스트림과 동일한 툴체인(xpack arm-none-eabi-gcc 10.3.1)을 받습니다.
      # 시스템 gcc 13을 쓰면 업스트림 main.c가 -Werror=array-bounds로 실패합니다.
      - name: Install ARM toolchain
        run: make arm_sdk_install

      # 두 타깃을 한 번에 -j로 돌리면 obj/를 공유해 경쟁 조건이 생길 수 있어
      # 순차 빌드합니다(각각 내부적으로 -j8).
      - name: Build PWM/DShot target
        run: make -j8 NES_80A_L431

      - name: Build CAN target
        run: make -j8 NES_80A_L431_CAN

      - name: Show sizes
        if: always()
        run: ls -la obj/ | grep -i NES || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NES-80A-hex
          path: |
            obj/AM32_NES_80A_L431_*.hex
            obj/AM32_NES_80A_L431_*.bin
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obj/AM32_NES_80A_L431_*.hex
            obj/AM32_NES_80A_L431_*.bin
