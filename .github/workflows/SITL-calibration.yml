name: SITL Calibration Tests

# Compares the SITL physics against the real-hardware bench captures:
# steady sweep, square amplitude sweep and 120s chirp per calibrated
# model. The captures, models and expected values live in the ESCSim
# repository, which is cloned to run them against this firmware.
# Heavier than the functional SITL tests (~25 min), so it runs only when
# the physics or the firmware it drives change, plus nightly.
#
# All measurements are paced against SITL simulation time, so a slow
# runner simply takes longer in wall time and measures the same
# experiment. The datasets run as parallel matrix jobs.
# Comparison graphs are uploaded as artifacts on every run.

on:
  push:
    branches: ["main"]
    paths:
      - "Mcu/SITL/**"
      - "Src/main.c"
      - "Src/DroneCAN/**"
  pull_request:
    branches: ["main"]
    paths:
      - "Mcu/SITL/**"
      - "Src/main.c"
      - "Src/DroneCAN/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      escsim_ref:
        description: 'ESCSim ref to test against'
        required: false
        default: 'main'
        type: string

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        dataset: [gt2215, nano2216]
    steps:
      - uses: actions/checkout@v4

      - name: Check out ESCSim
        uses: actions/checkout@v4
        with:
          repository: am32-firmware/ESCSim
          ref: ${{ inputs.escsim_ref || 'main' }}
          path: ESCSim

      - name: Build SITL
        run: make AM32_SITL_CAN

      - name: Install python dependencies
        run: python3 -m pip install dronecan plotly numpy matplotlib

      - name: Run calibration tests
        env:
          AM32_ROOT: ${{ github.workspace }}
        run: |
          mkdir calibration_run && cd calibration_run
          python3 "$GITHUB_WORKSPACE/ESCSim/SITL/run_calibration_tests.py" \
            --dataset ${{ matrix.dataset }} \
            --artifacts ../calibration_artifacts

      - name: Upload comparison graphs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-graphs-${{ matrix.dataset }}
          path: calibration_artifacts/

      - name: Upload run logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-logs-${{ matrix.dataset }}
          path: calibration_run/calrun_*/
